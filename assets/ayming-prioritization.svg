<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z"/></marker></defs><rect width="1100" height="540" fill="#fff"/><rect x="20" y="20" width="500" height="84" rx="16" fill="#e8e8ed"/><text x="40" y="50" font-size="15" font-weight="bold">Step 1</text><text x="40" y="72" font-size="13">Identify the most time-consuming daily task for each step</text><text x="40" y="90" font-size="13">and the actions that AI could optimise.</text><rect x="600" y="20" width="480" height="84" rx="16" fill="#e8e8ed"/><text x="620" y="50" font-size="15" font-weight="bold">Step 2</text><text x="620" y="72" font-size="13">Sort tasks by business impact and by effort</text><text x="620" y="90" font-size="13">(tasks that can be automated).</text><path d="M90 140V500" stroke="#000" stroke-width="1.5"/><text x="40" y="160" font-size="22">+</text><text x="42" y="500" font-size="22">–</text><rect x="20" y="250" width="54" height="26" rx="13" fill="#ffaebc"/><text x="47" y="268" font-size="12" text-anchor="middle">Effort</text><text x="110" y="160" font-size="13">Data analysis</text><text x="110" y="180" font-size="13">Mission report</text><text x="110" y="200" font-size="13">Collect project information</text><text x="110" y="220" font-size="13">Collect timesheets, function descriptions</text><text x="110" y="300" font-size="13">Collect HR researchers data</text><text x="110" y="320" font-size="13">Collect researchers’ diplomas</text><text x="110" y="340" font-size="13">Collect company information</text><text x="110" y="360" font-size="13">Meeting presentation</text><text x="110" y="420" font-size="13">Import data</text><text x="110" y="440" font-size="13">Agree on methodology</text><text x="110" y="460" font-size="13">Send files to client</text><path d="M660 140V500H1060" stroke="#000" stroke-width="1.5" fill="none"/><text x="640" y="320" font-size="14" transform="rotate(-90 640 320)" text-anchor="middle">IMPACT</text><text x="1060" y="525" font-size="14" text-anchor="end">EFFORT</text><rect x="694" y="143.05633802816902" width="216" height="28" rx="14.0" fill="#ffec40"/><text x="802" y="161.4" font-size="12" fill="#000" text-anchor="middle">Data analysis</text><rect x="683" y="188.69014084507043" width="216" height="28" rx="14.0" fill="#ffec40"/><text x="791" y="207.0" font-size="12" fill="#000" text-anchor="middle">Technical project collection</text><rect x="683" y="230.94366197183098" width="216" height="28" rx="14.0" fill="#ffec40"/><text x="791" y="249.3" font-size="12" fill="#000" text-anchor="middle">HR collection</text><rect x="702" y="283.3380281690141" width="216" height="28" rx="14.0" fill="#ffec40"/><text x="810" y="301.7" font-size="12" fill="#000" text-anchor="middle">Data sharing</text><rect x="752" y="377.98591549295776" width="216" height="28" rx="14.0" fill="#ffec40"/><text x="860" y="396.3" font-size="12" fill="#000" text-anchor="middle">Communication</text></svg>